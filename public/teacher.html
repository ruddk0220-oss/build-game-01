<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>조립 게임 결과 (교수자용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#fff4f8;--bg2:#eef7ff;--pink:#ff9fc4;--mint:#7fe3c9;--lav:#b9a7ff;--ink:#5b4a5a;--muted:#a99bb0;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jua',-apple-system,'Malgun Gothic',sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);min-height:100vh;padding:26px}
  .wrap{max-width:840px;margin:0 auto}
  h1{font-size:26px;color:#ff7fb0;margin-bottom:16px}
  .card{background:#fff;border:3px solid #ffe4f0;border-radius:28px;padding:26px;box-shadow:0 16px 40px rgba(255,159,196,.22)}
  input{padding:14px 16px;border:3px solid #ffe0ec;border-radius:16px;font-size:17px;font-family:inherit;outline:none;background:#fffafc}
  button{padding:14px 24px;border:none;border-radius:16px;font-size:17px;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--lav));box-shadow:0 6px 0 -1px #e98bc0}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 -1px #e98bc0}
  .row1{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .err{color:#ff6f8e;margin-top:10px;min-height:20px}
  .hidden{display:none}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}
  .stat{background:#fff0f6;border:2px solid #ffe0ec;border-radius:18px;padding:14px 22px;text-align:center;flex:1;min-width:120px}
  .stat .n{font-size:28px;color:var(--pink)}
  .stat .l{font-size:14px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:16px}
  th,td{padding:12px 10px;text-align:left;border-bottom:2px solid #f4eaf1}
  th{color:var(--muted);font-weight:normal;font-size:15px}
  tr:hover td{background:#fffafc}
  .tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .tool{background:#fff;border:2px solid #ffe0ec;color:#e07ba6;box-shadow:none;font-size:15px;padding:10px 18px;border-radius:999px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 조립 게임 결과 (교수자용)</h1>

  <div id="login" class="card">
    <p style="margin-bottom:14px;color:var(--muted)">확인용 비밀번호를 입력하세요</p>
    <div class="row1">
      <input id="code" type="password" placeholder="비밀번호" />
      <button id="loginBtn">확인</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="panel" class="card hidden">
    <div class="row1">
      <button id="refreshBtn">🔄 새로고침</button>
      <input id="search" placeholder="이름/학번 검색" style="flex:1;min-width:160px" />
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="stCount">0</div><div class="l">제출한 학생</div></div>
      <div class="stat"><div class="n" id="stAvg">0</div><div class="l">평균 점수</div></div>
      <div class="stat"><div class="n" id="stMax">0</div><div class="l">최고 점수</div></div>
    </div>
    <table>
      <thead><tr><th>이름</th><th>학번</th><th>점수</th><th>정답</th><th>제출시각</th><th>횟수</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="tools">
      <button class="tool" id="csvBtn">📥 엑셀(CSV)로 내려받기</button>
      <button class="tool" id="resetBtn">🗑️ 기록 전체 삭제</button>
    </div>
    <div class="err" id="msg" style="color:var(--mint)"></div>
  </div>
</div>

<script>
const $=(id)=>document.getElementById(id);
let CODE='', DATA=[];

$('loginBtn').onclick=load;
$('code').onkeydown=(e)=>{ if(e.key==='Enter') load(); };
$('refreshBtn').onclick=()=>fetchResults();
$('search').oninput=render;

function load(){
  CODE=$('code').value.trim();
  fetchResults(true);
}
function fetchResults(first){
  fetch('/api/results?code='+encodeURIComponent(CODE))
    .then(r=>{ if(r.status===401) throw new Error('비밀번호가 틀렸어요'); return r.json(); })
    .then(d=>{
      DATA=d.results||[];
      if(first){ $('login').classList.add('hidden'); $('panel').classList.remove('hidden'); }
      render();
    })
    .catch(e=>{ $('loginErr').textContent=e.message; });
}
function render(){
  const kw=$('search').value.trim().toLowerCase();
  const list=DATA.filter(r=>!kw||r.name.toLowerCase().includes(kw)||String(r.sid).toLowerCase().includes(kw));
  $('stCount').textContent=DATA.length;
  const avg=DATA.length?Math.round(DATA.reduce((s,r)=>s+r.score,0)/DATA.length):0;
  const max=DATA.length?Math.max(...DATA.map(r=>r.score)):0;
  $('stAvg').textContent=avg; $('stMax').textContent=max;
  $('tbody').innerHTML=list.map(r=>{
    const t=new Date(r.at); const ts=`${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    return `<tr><td>${esc(r.name)}</td><td>${esc(r.sid)}</td><td>${r.score}점</td><td>${r.correct}/${r.total}</td><td>${ts}</td><td>${r.attempts||1}회</td></tr>`;
  }).join('')||'<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:24px">아직 제출한 학생이 없어요</td></tr>';
}
$('csvBtn').onclick=()=>{
  const rows=[['이름','학번','점수','정답','총문항','제출시각','횟수']];
  DATA.forEach(r=>rows.push([r.name,r.sid,r.score,r.correct,r.total,r.at,r.attempts||1]));
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='퀴즈결과.csv'; a.click();
};
$('resetBtn').onclick=()=>{
  if(!confirm('정말 모든 제출 기록을 삭제할까요? (되돌릴 수 없어요)')) return;
  fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:CODE})})
    .then(r=>r.json()).then(d=>{ if(d.ok){ DATA=[]; render(); $('msg').textContent='기록을 삭제했어요.'; } });
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
