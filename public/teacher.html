<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>의학용어 게임 결과 (교수자용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#2d2a3e; --mint:#20c9a6; --mint-soft:#c5f3e9; --mint-deep:#009e82;
    --pink:#ff6fa5; --pink-soft:#ffd0e0; --pink-deep:#e6337a;
    --yellow:#ffc93c; --yellow-soft:#fff0c2; --cream:#ffffff; --line:#ece4dd; --muted:#7a7488;
    --no:#ff5a72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:linear-gradient(135deg,#ffe4a3 0%,#ffb3d1 50%,#8ee8d5 100%);background-attachment:fixed;color:var(--ink);min-height:100vh;padding:24px;line-height:1.55;font-size:16px;font-weight:500}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-family:'Jua',sans-serif;font-size:30px;margin-bottom:4px;color:var(--pink-deep)}
  .sub{color:var(--ink);font-size:16px;margin-bottom:20px;font-weight:700}
  h1,.btn,.stat .v{font-family:'Jua',sans-serif}

  .login{background:var(--cream);border:3px solid var(--pink);border-radius:26px;padding:26px;max-width:400px;box-shadow:0 12px 34px rgba(230,51,122,.18)}

  .qrcard{background:var(--cream);border:3px solid var(--mint);border-radius:26px;padding:22px 26px;margin-bottom:20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(32,201,166,.16)}
  .qr-left{flex:1;min-width:200px}
  .qr-title{font-family:'Jua',sans-serif;font-size:22px;color:var(--mint-deep);margin-bottom:8px}
  .qr-desc{font-size:15px;color:var(--ink);font-weight:500;line-height:1.5;margin-bottom:12px}
  .qr-url{font-size:14px;color:var(--pink-deep);font-weight:700;word-break:break-all;background:var(--pink-soft);padding:8px 12px;border-radius:12px;display:inline-block}
  .qr-right{flex-shrink:0}
  #qrbox{background:#fff;padding:14px;border-radius:18px;border:3px solid var(--mint-soft);width:172px;height:172px;display:flex;align-items:center;justify-content:center}
  #qrbox img,#qrbox canvas{display:block}
  .qr-loading{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
  input,select{padding:13px 16px;border:3px solid var(--pink);border-radius:16px;font-size:16px;background:#fff;color:var(--ink);outline:none;font-family:'Noto Sans KR',sans-serif;font-weight:700}
  input:focus,select:focus{border-color:var(--pink-deep)}
  .login input{width:100%;margin-bottom:12px}
  .btn{border:none;border-radius:16px;padding:13px 20px;font-size:17px;cursor:pointer;background:var(--pink-deep);color:#fff;box-shadow:0 4px 0 #a81f5a}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a81f5a}
  .btn.ghost{background:#fff;color:var(--pink-deep);border:3px solid var(--pink);box-shadow:0 4px 0 var(--pink-soft)}
  .btn.danger{background:var(--no);box-shadow:0 4px 0 #c62236}
  .err{color:var(--no);font-size:15px;font-weight:700;min-height:20px;margin-top:8px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .spacer{flex:1}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--cream);border:3px solid var(--mint);border-radius:20px;padding:14px 20px;min-width:130px;box-shadow:0 6px 18px rgba(32,201,166,.18)}
  .stat .k{font-size:14px;color:var(--ink);font-weight:700}
  .stat .v{font-size:28px;color:var(--mint-deep)}

  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--cream);border:3px solid var(--mint);border-radius:20px;overflow:hidden;box-shadow:0 8px 22px rgba(230,51,122,.12)}
  th,td{padding:13px 16px;text-align:left;font-size:16px;border-bottom:2px solid var(--mint-soft);font-weight:700}
  th{background:var(--mint-deep);color:#fff;font-weight:900}
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums}
  .rank1{color:var(--pink-deep);font-size:19px;font-weight:900}
  .empty{text-align:center;color:var(--muted);padding:34px;font-weight:700}
  .msg{color:var(--mint-deep);font-size:15px;font-weight:700;min-height:20px;margin-top:10px}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 의학용어 게임 결과 🌷</h1>
  <p class="sub">학생들의 제출 기록을 확인해요! (학생별 최고점 기준)</p>

  <div class="qrcard">
    <div class="qr-left">
      <div class="qr-title">📱 학생 접속용 QR</div>
      <div class="qr-desc">학생들이 휴대폰 카메라로 이 QR을 찍으면<br>바로 게임에 접속해요!</div>
      <div class="qr-url" id="qrUrl"></div>
    </div>
    <div class="qr-right">
      <div id="qrbox"><div class="qr-loading">QR 생성 중…</div></div>
    </div>
  </div>

  <div class="login" id="login">
    <input id="code" type="password" placeholder="교수자 비밀번호" />
    <button class="btn" id="loginBtn">확인 🔑</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="dash" class="hidden">
    <div style="text-align:right;font-size:14px;color:var(--mint-deep);font-weight:700;margin-bottom:8px">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint-deep);margin-right:5px;animation:blink 1.2s ease infinite"></span>5초마다 자동 갱신 중
    </div>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <select id="classFilter">
        <option value="">전체 분반</option>
        <option value="101">101분반</option>
        <option value="102">102분반</option>
        <option value="103">103분반</option>
      </select>
      <div class="spacer"></div>
      <button class="btn ghost" id="refreshBtn">새로고침 🔄</button>
      <button class="btn ghost" id="csvBtn">CSV 다운로드 📥</button>
      <button class="btn danger" id="resetBtn">기록 삭제 🗑️</button>
    </div>
    <div id="tableWrap"></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let CODE="", DATA=[];

// ── 학생 접속용 QR 생성 ──
(function makeQR(){
  // 현재 교수자 페이지 주소에서 학생 화면 주소를 자동 계산 (…/teacher.html → …/)
  let base = location.origin + location.pathname.replace(/teacher\.html$/,'').replace(/\/$/,'') + '/';
  // 로컬에서 파일로 열어본 경우엔 배포 주소를 기본값으로
  if(location.protocol==='file:' || !location.origin.startsWith('http')){
    base='https://build-game-01.onrender.com/';
  }
  $("qrUrl").textContent=base;
  const box=$("qrbox");
  function render(){
    if(typeof QRCode==='undefined'){
      // 라이브러리 로드 실패 시: 외부 QR 이미지 서비스로 대체
      box.innerHTML=`<img width="144" height="144" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=144x144&data=${encodeURIComponent(base)}">`;
      return;
    }
    box.innerHTML="";
    new QRCode(box, { text: base, width:144, height:144, colorDark:"#2d2a3e", colorLight:"#ffffff" });
  }
  // 스크립트가 늦게 로드될 수 있으니 약간 지연 후 시도
  if(document.readyState==='complete') render();
  else window.addEventListener('load', ()=>setTimeout(render,100));
})();

$("loginBtn").onclick=login;
$("code").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });

function login(){
  const code=$("code").value.trim();
  if(!code){ $("loginErr").textContent="비밀번호를 입력하세요."; return; }
  fetch('/api/results?code='+encodeURIComponent(code))
    .then(r=>{ if(!r.ok) throw new Error("forbidden"); return r.json(); })
    .then(d=>{
      CODE=code; DATA=d.list||[];
      $("login").classList.add("hidden");
      $("dash").classList.remove("hidden");
      render();
      startAutoRefresh();
    })
    .catch(()=>{ $("loginErr").textContent="비밀번호가 올바르지 않습니다."; });
}

let autoTimer=null;
function startAutoRefresh(){
  if(autoTimer) clearInterval(autoTimer);
  autoTimer=setInterval(()=>{
    fetch('/api/results?code='+encodeURIComponent(CODE))
      .then(r=>r.json()).then(d=>{ DATA=d.list||[]; render(); })
      .catch(()=>{});
  }, 5000);  // 5초마다 자동 갱신
}

$("refreshBtn").onclick=()=>{
  fetch('/api/results?code='+encodeURIComponent(CODE))
    .then(r=>r.json()).then(d=>{ DATA=d.list||[]; render(); $("msg").textContent="새로고침 완료 ✨"; });
};
$("classFilter").onchange=render;

$("resetBtn").onclick=()=>{
  if(!confirm("모든 기록을 삭제할까요? 되돌릴 수 없습니다.")) return;
  fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:CODE})})
    .then(r=>r.json()).then(d=>{ if(d.ok){ DATA=[]; render(); $("msg").textContent="기록을 삭제했습니다."; } });
};

$("csvBtn").onclick=()=>{
  const rows=filtered();
  const head=["분반","이름","학번","점수","정답","총문항","시도횟수","최종제출"];
  const lines=[head.join(",")];
  rows.forEach(r=>{
    lines.push([r.classNo,r.name,r.sid,r.score,r.correct,r.total,r.attempts||1,fmt(r.updatedAt)]
      .map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(","));
  });
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="의학용어게임_결과.csv";
  a.click();
};

function filtered(){
  const cf=$("classFilter").value;
  return DATA.filter(r=>!cf||String(r.classNo)===cf);
}

function render(){
  const rows=filtered();
  const n=rows.length;
  const avg=n? Math.round(rows.reduce((s,r)=>s+(r.score||0),0)/n*10)/10 : 0;
  const top=n? Math.max(...rows.map(r=>r.score||0)) : 0;
  $("stats").innerHTML=`
    <div class="stat"><div class="k">제출 인원</div><div class="v">${n}명</div></div>
    <div class="stat"><div class="k">평균 점수</div><div class="v">${avg}</div></div>
    <div class="stat"><div class="k">최고 점수</div><div class="v">${top}</div></div>
  `;
  if(n===0){ $("tableWrap").innerHTML=`<div class="empty">아직 제출된 기록이 없어요 🌱</div>`; return; }
  let html=`<table><thead><tr>
    <th>순위</th><th>분반</th><th>이름</th><th>학번</th><th>점수</th><th>정답/총</th><th>시도</th><th>최종 제출</th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    html+=`<tr>
      <td class="${i===0?'rank1':''}">${i===0?'👑 ':''}${i+1}</td>
      <td>${esc(r.classNo)}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.sid)}</td>
      <td class="num">${r.score}</td>
      <td class="num">${r.correct}/${r.total}</td>
      <td class="num">${r.attempts||1}</td>
      <td>${fmt(r.updatedAt)}</td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  $("tableWrap").innerHTML=html;
}

function fmt(iso){
  if(!iso) return "-";
  const d=new Date(iso);
  const p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
