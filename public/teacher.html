<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>의학용어 게임 결과 (교수자용)</title>
<style>
  :root{
    --ink:#1a2b3c; --paper:#f6f3ec; --card:#ffffff; --line:#e2ddd0; --muted:#8a8577;
    --teal:#0f7d76; --teal-soft:#e3f2f0; --gold:#c98a1f; --no:#c9433a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:24px;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:24px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px}

  .login{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:380px}
  input,select{padding:12px 14px;border:2px solid var(--line);border-radius:10px;font-size:15px;background:#fbfdff;color:var(--ink);outline:none;font-family:inherit}
  input:focus,select:focus{border-color:var(--teal)}
  .login input{width:100%;margin-bottom:12px}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--teal);color:#fff}
  .btn.ghost{background:#fff;color:var(--muted);border:2px solid var(--line)}
  .btn.danger{background:var(--no)}
  .err{color:var(--no);font-size:14px;min-height:20px;margin-top:8px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .spacer{flex:1}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:120px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:22px;font-weight:800;color:var(--teal)}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:11px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
  th{background:var(--teal-soft);color:var(--teal);font-weight:700}
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums}
  .rank1{font-weight:800;color:var(--gold)}
  .empty{text-align:center;color:var(--muted);padding:30px}
  .msg{color:var(--teal);font-size:14px;min-height:20px;margin-top:10px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 의학용어 게임 결과</h1>
  <p class="sub">학생들의 제출 기록을 확인합니다. (학생별 최고점 기준)</p>

  <div class="login" id="login">
    <input id="code" type="password" placeholder="교수자 비밀번호" />
    <button class="btn" id="loginBtn">확인</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="dash" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <select id="classFilter">
        <option value="">전체 분반</option>
        <option value="101">101분반</option>
        <option value="102">102분반</option>
        <option value="103">103분반</option>
      </select>
      <div class="spacer"></div>
      <button class="btn ghost" id="refreshBtn">새로고침</button>
      <button class="btn ghost" id="csvBtn">CSV 다운로드</button>
      <button class="btn danger" id="resetBtn">기록 삭제</button>
    </div>
    <div id="tableWrap"></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let CODE="", DATA=[];

$("loginBtn").onclick=login;
$("code").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });

function login(){
  const code=$("code").value.trim();
  if(!code){ $("loginErr").textContent="비밀번호를 입력하세요."; return; }
  fetch('/api/results?code='+encodeURIComponent(code))
    .then(r=>{ if(!r.ok) throw new Error("forbidden"); return r.json(); })
    .then(d=>{
      CODE=code; DATA=d.list||[];
      $("login").classList.add("hidden");
      $("dash").classList.remove("hidden");
      render();
    })
    .catch(()=>{ $("loginErr").textContent="비밀번호가 올바르지 않습니다."; });
}

$("refreshBtn").onclick=()=>{
  fetch('/api/results?code='+encodeURIComponent(CODE))
    .then(r=>r.json()).then(d=>{ DATA=d.list||[]; render(); $("msg").textContent="새로고침 완료"; });
};
$("classFilter").onchange=render;

$("resetBtn").onclick=()=>{
  if(!confirm("모든 기록을 삭제할까요? 되돌릴 수 없습니다.")) return;
  fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:CODE})})
    .then(r=>r.json()).then(d=>{ if(d.ok){ DATA=[]; render(); $("msg").textContent="기록을 삭제했습니다."; } });
};

$("csvBtn").onclick=()=>{
  const rows=filtered();
  const head=["분반","이름","학번","점수","정답","총문항","시도횟수","최종제출"];
  const lines=[head.join(",")];
  rows.forEach(r=>{
    lines.push([r.classNo,r.name,r.sid,r.score,r.correct,r.total,r.attempts||1,fmt(r.updatedAt)]
      .map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(","));
  });
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="의학용어게임_결과.csv";
  a.click();
};

function filtered(){
  const cf=$("classFilter").value;
  return DATA.filter(r=>!cf||String(r.classNo)===cf);
}

function render(){
  const rows=filtered();
  // 통계
  const n=rows.length;
  const avg=n? Math.round(rows.reduce((s,r)=>s+(r.score||0),0)/n*10)/10 : 0;
  const top=n? Math.max(...rows.map(r=>r.score||0)) : 0;
  $("stats").innerHTML=`
    <div class="stat"><div class="k">제출 인원</div><div class="v">${n}명</div></div>
    <div class="stat"><div class="k">평균 점수</div><div class="v">${avg}</div></div>
    <div class="stat"><div class="k">최고 점수</div><div class="v">${top}</div></div>
  `;
  // 표
  if(n===0){ $("tableWrap").innerHTML=`<div class="empty">아직 제출된 기록이 없습니다.</div>`; return; }
  let html=`<table><thead><tr>
    <th>순위</th><th>분반</th><th>이름</th><th>학번</th><th>점수</th><th>정답/총</th><th>시도</th><th>최종 제출</th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    html+=`<tr>
      <td class="${i===0?'rank1':''}">${i+1}</td>
      <td>${esc(r.classNo)}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.sid)}</td>
      <td class="num">${r.score}</td>
      <td class="num">${r.correct}/${r.total}</td>
      <td class="num">${r.attempts||1}</td>
      <td>${fmt(r.updatedAt)}</td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  $("tableWrap").innerHTML=html;
}

function fmt(iso){
  if(!iso) return "-";
  const d=new Date(iso);
  const p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
