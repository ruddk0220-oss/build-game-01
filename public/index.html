<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>의학용어 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2d2a3e; --mint:#20c9a6; --mint-soft:#c5f3e9; --mint-deep:#009e82;
    --pink:#ff6fa5; --pink-soft:#ffd0e0; --pink-deep:#e6337a;
    --yellow:#ffc93c; --yellow-soft:#fff0c2;
    --cream:#ffffff; --line:#ece4dd; --muted:#7a7488;
    --ok:#12b886; --ok-soft:#cdf5e6; --no:#ff5a72; --no-soft:#ffd6dc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans KR','Malgun Gothic',sans-serif;
    background:linear-gradient(135deg,#ffe4a3 0%,#ffb3d1 50%,#8ee8d5 100%);
    background-attachment:fixed;
    color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;line-height:1.55;
    font-size:16px;font-weight:500;
  }
  .card{
    background:var(--cream);width:100%;max-width:520px;border-radius:32px;
    border:3px solid #fff;
    box-shadow:0 18px 50px rgba(255,127,163,.18), 0 4px 12px rgba(126,217,195,.15);
    overflow:hidden;position:relative;
  }
  .card::before{
    content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;
    background:var(--yellow-soft);border-radius:50%;opacity:.6;z-index:0;
  }
  h1,h2,.prompt,.big,.btn,.qtag,.done .rank{font-family:'Jua',sans-serif;font-weight:400}

  .top{padding:20px 26px 0;position:relative;z-index:1}
  .progress-wrap{display:flex;align-items:center;gap:12px}
  .progress-bar{flex:1;height:14px;background:#fff;border:2px solid var(--pink);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--pink-deep),var(--mint-deep));width:0%;transition:width .4s cubic-bezier(.34,1.56,.64,1);border-radius:99px}
  .progress-txt{font-size:15px;color:var(--ink);font-weight:700;white-space:nowrap}
  .score-pill{font-size:15px;font-weight:900;color:#fff;background:var(--mint-deep);padding:5px 14px;border-radius:99px;border:2px solid #fff}

  .body{padding:26px;position:relative;z-index:1}

  /* 참가 화면 */
  .intro{text-align:center}
  .intro h1{font-size:32px;margin-bottom:6px;color:var(--pink-deep)}
  .intro .lead{color:var(--ink);font-size:17px;margin-bottom:22px;font-weight:700}
  input,select{
    width:100%;padding:15px 18px;border:3px solid var(--pink);border-radius:20px;
    font-size:18px;background:#fff;color:var(--ink);margin-bottom:13px;outline:none;
    font-family:'Noto Sans KR',sans-serif;font-weight:700;transition:border-color .2s ease;
  }
  input::placeholder{color:#b8b2c0}
  input:focus,select:focus{border-color:var(--pink-deep)}
  .rules{background:var(--mint-soft);border:2px solid var(--mint);border-radius:22px;padding:18px 20px;margin:6px 0 20px;text-align:left}
  .rules .r{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;font-size:16px;color:var(--ink);font-weight:500}
  .rules .r:last-child{margin-bottom:0}
  .rules .r b{color:var(--mint-deep);font-weight:900}
  .rules .ic{flex-shrink:0;width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff}
  .err{color:var(--no);font-size:15px;font-weight:700;min-height:22px;margin-bottom:6px}

  /* 이어하기 배너 */
  .resume{background:var(--yellow-soft);border:3px solid var(--yellow);border-radius:20px;padding:16px 18px;margin-bottom:16px;text-align:left}
  .resume .r-msg{font-size:15px;color:#7a4e00;font-weight:700;margin-bottom:12px;line-height:1.4}
  .resume .r-msg b{color:var(--pink-deep)}
  .resume .r-btns{display:flex;gap:10px}
  .resume .r-btns .btn{padding:12px;font-size:16px}
  .btn-resume{background:var(--mint-deep);box-shadow:0 4px 0 #007a66}
  .btn-resume:active{box-shadow:0 1px 0 #007a66}
  .btn-new{background:#fff;color:var(--muted);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
  .btn-new:active{box-shadow:0 1px 0 var(--line)}

  .qtag{display:inline-block;font-size:15px;padding:6px 16px;border-radius:99px;margin-bottom:14px;font-weight:900}
  .qtag.build{background:var(--mint-deep);color:#fff}
  .qtag.choice{background:var(--yellow);color:#7a4e00}
  .prompt{font-size:28px;margin-bottom:6px;line-height:1.3;color:var(--ink)}
  .hint{font-size:15px;color:var(--muted);margin-bottom:22px;font-weight:700}

  .build-slot{min-height:66px;border:3px dashed var(--pink);border-radius:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;margin-bottom:8px;background:#fff}
  .build-slot.empty::before{content:"여기에 조립해요 ✨";color:#b8b2c0;font-size:16px;font-weight:700}
  .slot-tile{background:var(--mint-deep);color:#fff;font-weight:700;font-size:19px;padding:10px 17px;border-radius:16px;cursor:pointer;animation:pop .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 0 #007a66}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .slot-hint{font-size:14px;color:var(--muted);margin-bottom:16px;font-weight:700}
  .tiles{display:flex;flex-wrap:wrap;gap:11px;margin-bottom:22px}
  .tile{background:#fff;border:3px solid var(--mint-deep);color:var(--mint-deep);font-weight:900;font-size:19px;padding:11px 18px;border-radius:16px;cursor:pointer;transition:transform .12s ease,background .15s ease;box-shadow:0 4px 0 var(--mint)}
  .tile:hover{background:var(--mint-soft);animation:wiggle .3s ease}
  .tile:active{transform:translateY(4px);box-shadow:0 0 0 var(--mint)}
  .tile.used{opacity:.35;pointer-events:none;text-decoration:line-through;box-shadow:none}

  .choices{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
  .choice{text-align:left;background:#fff;border:3px solid var(--pink);border-radius:20px;padding:15px 18px;font-size:17px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .12s ease,border-color .15s ease;font-family:'Noto Sans KR',sans-serif;font-weight:700}
  .choice:hover{border-color:var(--pink-deep);transform:translateX(3px)}
  .choice .num{flex-shrink:0;width:32px;height:32px;border-radius:12px;background:var(--pink-deep);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff}
  .choice.correct{border-color:var(--ok);background:var(--ok-soft)}
  .choice.correct .num{background:var(--ok);color:#fff}
  .choice.wrong{border-color:var(--no);background:var(--no-soft)}
  .choice.wrong .num{background:var(--no);color:#fff}
  .choice.locked{pointer-events:none}
  .choice.dim{opacity:.45}

  .btn{width:100%;border:none;border-radius:20px;padding:16px;font-size:20px;cursor:pointer;font-family:'Jua',sans-serif;transition:transform .12s ease;color:#fff}
  .btn:active{transform:translateY(3px)}
  .btn-primary{background:var(--pink-deep);box-shadow:0 5px 0 #a81f5a}
  .btn-primary:active{box-shadow:0 1px 0 #a81f5a}
  .btn-gold{background:var(--mint-deep);box-shadow:0 5px 0 #007a66}
  .btn-gold:active{box-shadow:0 1px 0 #007a66}
  .btn:disabled{opacity:.4;pointer-events:none;box-shadow:none}

  .fb{border-radius:20px;padding:15px 18px;margin-bottom:16px;font-size:16px;font-weight:700;animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
  .fb.ok{background:var(--ok-soft);color:#0a7a5c;border:2px solid var(--ok)}
  .fb.no{background:var(--no-soft);color:#c62236;border:2px solid var(--no)}
  .fb b{color:var(--ink)}
  .fb-title{font-family:'Jua',sans-serif;font-size:19px;margin-bottom:2px}

  .done{text-align:center;padding:10px 0}
  .done .emoji{font-size:70px;display:block;margin-bottom:8px;animation:wiggle 1s ease infinite}
  .done .big{font-size:48px;margin-bottom:4px;color:var(--pink-deep)}
  .done .sub{color:var(--ink);font-size:17px;margin-bottom:8px;font-weight:700}
  .done .who{font-size:16px;color:#7a4e00;margin-bottom:16px;font-weight:700;background:var(--yellow);display:inline-block;padding:6px 16px;border-radius:99px}
  .done .rank{font-size:22px;margin-bottom:12px;color:var(--mint-deep)}
  .submitMsg{font-size:15px;color:var(--mint-deep);font-weight:700;min-height:24px;margin-bottom:16px}

  /* 리더보드 */
  .lb{background:#fff;border:3px solid var(--yellow);border-radius:22px;padding:16px 14px;margin-bottom:18px;text-align:left}
  .lb-title{font-family:'Jua',sans-serif;font-size:20px;color:#7a4e00;text-align:center;margin-bottom:4px}
  .lb-live{text-align:center;font-size:13px;color:var(--mint-deep);font-weight:700;margin-bottom:12px}
  .lb-live .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint-deep);margin-right:5px;animation:blink 1.2s ease infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;margin-bottom:6px;font-weight:700;font-size:15px}
  .lb-row:last-child{margin-bottom:0}
  .lb-row .r-rank{flex-shrink:0;width:30px;text-align:center;font-family:'Jua',sans-serif;font-size:17px;color:var(--muted)}
  .lb-row .r-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-row .r-cls{flex-shrink:0;font-size:12px;color:var(--muted);background:var(--mint-soft);padding:2px 8px;border-radius:99px}
  .lb-row .r-score{flex-shrink:0;font-family:'Jua',sans-serif;color:var(--mint-deep)}
  .lb-row.top1{background:linear-gradient(135deg,#fff3cc,#ffe38a);border:2px solid var(--yellow)}
  .lb-row.top1 .r-rank{color:#d99b00}
  .lb-row.top2{background:#eef1f5}
  .lb-row.top3{background:#f7eee6}
  .lb-row.me{background:var(--pink-soft);border:2px solid var(--pink);box-shadow:0 2px 8px rgba(230,51,122,.15)}
  .lb-row.me .r-name{color:var(--pink-deep);font-weight:900}
  .lb-row.me .r-name::after{content:" (나)";font-size:12px;color:var(--pink-deep)}
  .lb-empty{text-align:center;color:var(--muted);font-weight:700;padding:14px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">

  <div class="top hidden" id="top">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-txt" id="progressTxt">1 / 22</span>
      <span class="score-pill" id="scorePill">0점</span>
    </div>
  </div>

  <div class="body">

    <!-- 참가 화면 -->
    <div id="intro" class="intro">
      <h1>🩺 의학용어 게임 🧸</h1>
      <p class="lead">이름·학번·분반을 적고 시작해요!</p>
      <div id="resumeBox" class="hidden"></div>
      <input id="name" placeholder="이름" maxlength="20" />
      <input id="sid" placeholder="학번" maxlength="20" />
      <select id="classNo">
        <option value="">분반을 골라요</option>
        <option value="101">101</option>
        <option value="102">102</option>
        <option value="103">103</option>
      </select>
      <div class="rules">
        <div class="r"><div class="ic">🧩</div><div><b>조립 문제</b> — 한글 뜻을 보고 어근·연결모음·접미사 타일을 순서대로 눌러 영어 용어를 만들어요!</div></div>
        <div class="r"><div class="ic">✅</div><div><b>객관식 문제</b> — 네 개의 보기 중 정답을 하나 골라요!</div></div>
      </div>
      <div class="err" id="err"></div>
      <button class="btn btn-primary" id="startBtn">시작하기 🚀</button>
    </div>

    <div id="quiz" class="hidden"></div>
    <div id="result" class="hidden"></div>

  </div>
</div>

<script>
const BUILD = [
  { meaning:"백혈구",   answer:["leuk","o","cyte"],    distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"적혈구",   answer:["erythr","o","cyte"],  distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"신장염",   answer:["nephr","itis"],       distractors:["o","gastr","otomy","pathy"] },
  { meaning:"신경병증", answer:["neur","o","pathy"],   distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"피부질환", answer:["dermat","o","pathy"], distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"간비대",   answer:["hepat","o","megaly"], distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"심장비대", answer:["cardi","o","megaly"], distractors:["oste","gastr","itis","pathy"] },
  { meaning:"관절염",   answer:["arthr","itis"],       distractors:["o","gastr","megaly","pathy"] },
  { meaning:"위절제술", answer:["gastr","ectomy"],     distractors:["o","arthr","itis","pathy"] },
  { meaning:"신장질환", answer:["nephr","o","pathy"],  distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"신경통",   answer:["neur","algia"],       distractors:["o","gastr","itis","ectomy"] },
];

const CHOICE = [
  { prompt:"의학용어에서 '푸른색(blue)'을 나타내는 색깔 어근은?",
    choices:["leuk/o","melan/o","cyan/o","erythr/o"], answer:2 },
  { prompt:"다음 중 '염증'을 뜻하는 접미사는?",
    choices:["-ectomy","-itis","-megaly","-pathy"], answer:1 },
  { prompt:"단어 cardiomegaly에서 접미사 -megaly의 정확한 의미는?",
    choices:["염증","절제술","거대함, 커짐","질병"], answer:2 },
  { prompt:"다음 중 '뼈'를 뜻하는 어근은?",
    choices:["dermat/o","oste/o","neur/o","gastr/o"], answer:1 },
  { prompt:"의학용어 부품을 이을 때 사용하는 연결모음에 대한 설명으로 옳은 것은?",
    choices:[
      "어근과 어근을 이을 때는 연결모음을 넣지 않는다.",
      "자음으로 시작하는 접미사가 오면 연결모음 'o'를 넣는다.",
      "모음으로 시작하는 접미사가 오면 연결모음 'o'를 반드시 붙인다.",
      "자음 앞·모음 앞 규칙이 항상 예외 없이 똑같이 적용된다."
    ], answer:1 },
  { prompt:"다음 중 '복부(배)'를 뜻하는 전신용어 어근은?",
    choices:["crani/o","thorac/o","abdomin/o","lumb/o"], answer:2 },
  { prompt:"복부를 배꼽 기준으로 4등분했을 때, '오른쪽위사분역'을 뜻하는 약어는?",
    choices:["LUQ","LLQ","RUQ","RLQ"], answer:2 },
  { prompt:"인체를 좌우 대칭으로 나누는 가상의 면은?",
    choices:["이마면 (Frontal plane)","가로면 (Transverse plane)","정중시상면 (Midsagittal plane)","수평면 (Horizontal plane)"], answer:2 },
  { prompt:"인체 방향 용어 중 '몸쪽에 가까운'을 뜻하는 용어는?",
    choices:["distal","proximal","medial","lateral"], answer:1 },
  { prompt:"병동 실무에서 '즉시, 응급'으로 진행함을 뜻하는 약어는?",
    choices:["NPO","PRN","stat","BID"], answer:2 },
  { prompt:"하루에 3회 투약을 뜻하는 병동 처방 약어는?",
    choices:["TID","QID","HS","IM"], answer:0 },
];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

let student=null, quizList=[], current=0, score=0, answered=false;

function buildQuizList(){
  const b=BUILD.map(q=>({type:"build",...q}));
  const c=CHOICE.map(q=>({type:"choice",...q}));
  quizList=shuffle([...b,...c]);
}

// ── 이어하기: 진행상황 저장/복원 ──
const SAVE_KEY="medgame_progress_v1";
function saveProgress(){
  try{
    const data={ student, quizList, current, score, answered, finished:false };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function markFinished(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){ const d=JSON.parse(raw); d.finished=true; localStorage.setItem(SAVE_KEY, JSON.stringify(d)); }
  }catch(e){}
}
function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadProgress(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d=JSON.parse(raw);
    if(!d.student || !Array.isArray(d.quizList)) return null;
    return d;
  }catch(e){ return null; }
}

const $=id=>document.getElementById(id);
const $intro=$("intro"), $quiz=$("quiz"), $result=$("result"), $top=$("top");

$("startBtn").onclick=()=>{
  const name=$("name").value.trim(), sid=$("sid").value.trim(), classNo=$("classNo").value;
  if(!name||!sid||!classNo){ $("err").textContent="이름, 학번, 분반을 모두 적어주세요! 🥺"; return; }
  student={name,sid,classNo};
  buildQuizList(); current=0; score=0; answered=false;
  saveProgress();
  $intro.classList.add("hidden"); $result.classList.add("hidden");
  $quiz.classList.remove("hidden"); $top.classList.remove("hidden");
  renderQuestion();
};

// 저장된 진행상황이 있으면 이어하기
function resumeGame(d){
  student=d.student; quizList=d.quizList; current=d.current||0; score=d.score||0; answered=false;
  $intro.classList.add("hidden"); $result.classList.add("hidden");
  $quiz.classList.remove("hidden"); $top.classList.remove("hidden");
  renderQuestion();
}

function updateTop(){
  const total=quizList.length;
  $("progressFill").style.width=(current/total*100)+"%";
  $("progressTxt").textContent=(current+1)+" / "+total;
  $("scorePill").textContent=score+"점";
}

function renderQuestion(){
  answered=false; updateTop();
  const q=quizList[current];
  if(q.type==="build") renderBuild(q); else renderChoice(q);
}

function renderBuild(q){
  const distractorList=q.distractors||["oste","gastr","itis","ectomy"];
  const scrambled=shuffle([...q.answer,...distractorList]);
  const placed=[];

  $quiz.innerHTML=`
    <span class="qtag build">🧩 조립 문제</span>
    <div class="prompt">${q.meaning}</div>
    <div class="hint">올바른 타일을 순서대로 눌러 조립해요! (함정 타일 조심 🙈)</div>
    <div class="build-slot empty" id="slot"></div>
    <div class="slot-hint">조립한 타일을 누르면 다시 뺄 수 있어요 ↩️</div>
    <div class="tiles" id="tiles"></div>
    <div id="fbArea"></div>
    <button class="btn btn-primary" id="checkBtn" disabled>정답 확인 🔍</button>
  `;
  const $slot=$("slot"), $tiles=$("tiles"), $check=$("checkBtn");

  scrambled.forEach((part,idx)=>{
    const t=document.createElement("button");
    t.className="tile"; t.textContent=part;
    t.onclick=()=>{ if(answered) return; t.classList.add("used"); placed.push(idx); redrawSlot(); };
    $tiles.appendChild(t);
  });

  function redrawSlot(){
    $slot.innerHTML="";
    $slot.classList.toggle("empty", placed.length===0);
    placed.forEach((sIdx,pos)=>{
      const st=document.createElement("span");
      st.className="slot-tile"; st.textContent=scrambled[sIdx];
      st.onclick=()=>{ if(answered) return; placed.splice(pos,1); $tiles.children[sIdx].classList.remove("used"); redrawSlot(); };
      $slot.appendChild(st);
    });
    $check.disabled = placed.length===0;
  }

  $check.onclick=()=>{
    if(answered) return; answered=true;
    const made=placed.map(i=>scrambled[i]);
    const correct=(made.length===q.answer.length)&&made.every((v,i)=>v===q.answer[i]);
    if(correct) score++;
    [...$tiles.children].forEach(c=>c.style.pointerEvents="none");
    [...$slot.children].forEach(c=>c.style.pointerEvents="none");
    const correctWord=q.answer.join(""), madeWord=made.join("");
    $("fbArea").innerHTML = correct
      ? `<div class="fb ok"><div class="fb-title">정답이에요! 🎉</div><b>${correctWord}</b> = ${q.answer.join(" + ")}</div>`
      : `<div class="fb no"><div class="fb-title">아쉬워요 🥲</div>내 답: ${madeWord||"—"} · 정답: <b>${correctWord}</b> (${q.answer.join(" + ")})</div>`;
    swapToNext($check);
  };
}

function renderChoice(q){
  const order=shuffle(q.choices.map((text,i)=>({text,correct:i===q.answer})));
  $quiz.innerHTML=`
    <span class="qtag choice">✅ 객관식 문제</span>
    <div class="prompt">${q.prompt}</div>
    <div class="hint">정답이라고 생각하는 보기를 하나 골라요!</div>
    <div class="choices" id="choices"></div>
    <div id="fbArea"></div>
    <button class="btn btn-gold hidden" id="nextBtn">다음 문제 ➡️</button>
  `;
  const $choices=$("choices"), numLabels=["①","②","③","④","⑤"];
  order.forEach((opt,idx)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML=`<span class="num">${numLabels[idx]}</span><span>${opt.text}</span>`;
    b.onclick=()=>{
      if(answered) return; answered=true;
      if(opt.correct) score++;
      [...$choices.children].forEach((c,i)=>{
        c.classList.add("locked");
        if(order[i].correct) c.classList.add("correct");
        else if(i===idx) c.classList.add("wrong");
        else c.classList.add("dim");
      });
      const correctText=order.find(o=>o.correct).text;
      $("fbArea").innerHTML = opt.correct
        ? `<div class="fb ok"><div class="fb-title">정답이에요! 🎉</div>잘했어요!</div>`
        : `<div class="fb no"><div class="fb-title">아쉬워요 🥲</div>정답: <b>${correctText}</b></div>`;
      const $next=$("nextBtn");
      $next.classList.remove("hidden");
      $next.textContent = isLast() ? "결과 보기 🎁" : "다음 문제 ➡️";
      $next.onclick=goNext;
      updateTop();
      saveProgress();
    };
    $choices.appendChild(b);
  });
}

function isLast(){ return current>=quizList.length-1; }
function swapToNext(btn){
  answered=true; saveProgress();
  updateTop();
  btn.textContent = isLast() ? "결과 보기 🎁" : "다음 문제 ➡️";
  btn.className="btn btn-gold"; btn.disabled=false; btn.onclick=goNext;
}
function goNext(){ current++; answered=false; saveProgress(); if(current>=quizList.length) showResult(); else renderQuestion(); }

function showResult(){
  markFinished();
  $quiz.classList.add("hidden"); $top.classList.add("hidden"); $result.classList.remove("hidden");
  const total=quizList.length, pct=Math.round(score/total*100);
  let emoji,rank;
  if(pct===100){emoji="🏆";rank="완벽해요! 의학용어 마스터 👑";}
  else if(pct>=80){emoji="🎉";rank="훌륭해요! 🌟";}
  else if(pct>=60){emoji="😊";rank="잘했어요! 👍";}
  else if(pct>=40){emoji="💪";rank="조금만 더 힘내요!";}
  else{emoji="📚";rank="복습하러 가볼까요?";}

  $result.innerHTML=`
    <div class="done">
      <span class="emoji">${emoji}</span>
      <div class="big">${score} / ${total}</div>
      <div class="sub">정답률 ${pct}%</div>
      <div class="who">${student.name} · ${student.sid} · ${student.classNo}분반</div>
      <div class="rank">${rank}</div>
      <div class="submitMsg" id="submitMsg">제출 중… 📮</div>

      <div class="lb" id="lb">
        <div class="lb-title">🏆 실시간 순위</div>
        <div class="lb-live"><span class="dot"></span>자동으로 갱신돼요</div>
        <div id="lbList"><div class="lb-empty">순위를 불러오는 중… ⏳</div></div>
      </div>

      <button class="btn btn-primary" id="againBtn">다시 도전하기 🔄</button>
    </div>
  `;
  $("againBtn").onclick=()=>{
    stopLeaderboard();
    buildQuizList(); current=0; score=0; answered=false;
    saveProgress();
    $result.classList.add("hidden"); $quiz.classList.remove("hidden"); $top.classList.remove("hidden");
    renderQuestion();
  };
  submit();
}

let lbTimer=null;
function startLeaderboard(){
  fetchLeaderboard();
  stopLeaderboard();
  lbTimer=setInterval(fetchLeaderboard, 3000);  // 3초마다 자동 갱신
}
function stopLeaderboard(){ if(lbTimer){ clearInterval(lbTimer); lbTimer=null; } }

function fetchLeaderboard(){
  fetch('/api/leaderboard')
    .then(r=>r.json())
    .then(d=>renderLeaderboard(d.list||[]))
    .catch(()=>{});
}

function renderLeaderboard(list){
  const el=$("lbList");
  if(!el) { stopLeaderboard(); return; }
  if(list.length===0){ el.innerHTML=`<div class="lb-empty">아직 순위가 없어요 🌱</div>`; return; }
  const medals=["🥇","🥈","🥉"];
  // 내 기록 찾기 (이름+학번뒤2자리+분반 일치)
  const myTail = student.sid ? String(student.sid).slice(-2) : '';
  const top = list.slice(0, 10);
  let html="";
  top.forEach(r=>{
    const isMe = r.name===student.name && r.sidTail===myTail && String(r.classNo)===String(student.classNo);
    const cls = "lb-row"+(r.rank===1?" top1":r.rank===2?" top2":r.rank===3?" top3":"")+(isMe?" me":"");
    const rankLabel = r.rank<=3 ? medals[r.rank-1] : r.rank;
    html+=`<div class="${cls}">
      <span class="r-rank">${rankLabel}</span>
      <span class="r-name">${esc(r.name)}</span>
      <span class="r-cls">${esc(r.classNo)}</span>
      <span class="r-score">${r.score}점</span>
    </div>`;
  });
  // 내가 TOP10 밖이면 맨 아래에 내 순위 따로 표시
  const meInTop = top.some(r=>r.name===student.name && r.sidTail===myTail && String(r.classNo)===String(student.classNo));
  if(!meInTop){
    const mine = list.find(r=>r.name===student.name && r.sidTail===myTail && String(r.classNo)===String(student.classNo));
    if(mine){
      html+=`<div class="lb-row me" style="margin-top:8px">
        <span class="r-rank">${mine.rank}</span>
        <span class="r-name">${esc(mine.name)}</span>
        <span class="r-cls">${esc(mine.classNo)}</span>
        <span class="r-score">${mine.score}점</span>
      </div>`;
    }
  }
  el.innerHTML=html;
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function submit(){
  fetch('/api/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name:student.name, sid:student.sid, classNo:student.classNo,
      score, correct:score, total:quizList.length
    })
  })
  .then(r=>r.json())
  .then(d=>{
    $("submitMsg").textContent = d.ok ? "✅ 제출 완료! 선생님이 확인할 수 있어요" : "제출 실패 😢 다시 시도해주세요";
    startLeaderboard();  // 제출 후 순위 자동 갱신 시작
  })
  .catch(()=>{
    $("submitMsg").textContent="제출 저장 실패 😢 네트워크를 확인해주세요";
    startLeaderboard();  // 실패해도 순위는 보여줌
  });
}

// ── 페이지 로드 시: 저장된 진행상황이 있으면 이어하기 배너 표시 ──
(function checkResume(){
  const d=loadProgress();
  if(!d || d.finished) return;  // 없거나 이미 끝낸 게임이면 무시
  const done=d.current||0, total=(d.quizList||[]).length||22;
  const box=$("resumeBox");
  box.className="resume";
  box.innerHTML=`
    <div class="r-msg"><b>${esc(d.student.name)}</b>님, 풀던 게임이 있어요!<br>
    ${done}번째 문제까지 진행했어요 (현재 ${d.score||0}점). 이어서 할까요?</div>
    <div class="r-btns">
      <button class="btn btn-resume" id="resumeBtn">이어하기 ▶️</button>
      <button class="btn btn-new" id="newBtn">새로 시작</button>
    </div>
  `;
  $("resumeBtn").onclick=()=>resumeGame(d);
  $("newBtn").onclick=()=>{
    clearProgress();
    box.className="hidden"; box.innerHTML="";
    // 저장돼 있던 이름·학번·분반을 입력창에 미리 채워줌 (편의)
    if(d.student){ $("name").value=d.student.name||""; $("sid").value=d.student.sid||""; $("classNo").value=d.student.classNo||""; }
  };
  // 이어하기 배너가 있을 때도 이름은 미리 채워두면 편함
  if(d.student){ $("name").value=d.student.name||""; $("sid").value=d.student.sid||""; $("classNo").value=d.student.classNo||""; }
})();
</script>
