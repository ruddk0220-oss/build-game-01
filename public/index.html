<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>의학용어 게임</title>
<style>
  :root{
    --ink:#1a2b3c; --paper:#f6f3ec; --card:#ffffff; --line:#e2ddd0; --muted:#8a8577;
    --teal:#0f7d76; --teal-soft:#e3f2f0; --gold:#c98a1f; --gold-soft:#f6ecd6;
    --ok:#1a8f6b; --ok-soft:#e0f3ea; --no:#c9433a; --no-soft:#fbe6e4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;
    background:var(--paper);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;line-height:1.5;
  }
  .card{
    background:var(--card);width:100%;max-width:520px;border-radius:20px;
    border:1px solid var(--line);box-shadow:0 12px 40px rgba(26,43,60,.08);overflow:hidden;
  }

  .top{padding:18px 24px 0}
  .progress-wrap{display:flex;align-items:center;gap:12px}
  .progress-bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:var(--teal);width:0%;transition:width .35s ease}
  .progress-txt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .score-pill{font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:4px 12px;border-radius:99px}

  .body{padding:24px}

  /* 참가 화면 */
  .intro h1{font-size:26px;margin-bottom:8px;letter-spacing:-.5px}
  .intro .lead{color:var(--muted);font-size:15px;margin-bottom:20px}
  input,select{
    width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;
    font-size:16px;background:#fbfdff;color:var(--ink);margin-bottom:12px;outline:none;font-family:inherit;
  }
  input:focus,select:focus{border-color:var(--teal)}
  .rules{background:var(--paper);border-radius:14px;padding:16px 18px;margin:8px 0 20px}
  .rules .r{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;font-size:14px}
  .rules .r:last-child{margin-bottom:0}
  .rules .ic{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .ic.build{background:var(--teal-soft)}
  .ic.choice{background:var(--gold-soft)}
  .err{color:var(--no);font-size:14px;min-height:20px;margin-bottom:6px}

  .qtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.3px;padding:5px 12px;border-radius:99px;margin-bottom:14px}
  .qtag.build{background:var(--teal-soft);color:var(--teal)}
  .qtag.choice{background:var(--gold-soft);color:var(--gold)}
  .prompt{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px;line-height:1.35}
  .hint{font-size:14px;color:var(--muted);margin-bottom:22px}

  .build-slot{min-height:60px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;margin-bottom:8px}
  .build-slot.empty::before{content:"여기에 조립됩니다";color:var(--muted);font-size:14px}
  .slot-tile{background:var(--teal);color:#fff;font-weight:700;font-size:16px;padding:9px 15px;border-radius:10px;cursor:pointer;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .slot-hint{font-size:12px;color:var(--muted);margin-bottom:16px}
  .tiles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
  .tile{background:#fff;border:2px solid var(--teal);color:var(--teal);font-weight:700;font-size:16px;padding:10px 16px;border-radius:10px;cursor:pointer;transition:transform .1s ease,background .15s ease}
  .tile:hover{background:var(--teal-soft)}
  .tile:active{transform:translateY(2px)}
  .tile.used{opacity:.3;pointer-events:none;text-decoration:line-through}

  .choices{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .choice{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .15s ease,background .15s ease;font-family:inherit}
  .choice:hover{border-color:var(--gold)}
  .choice .num{flex-shrink:0;width:26px;height:26px;border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted)}
  .choice.correct{border-color:var(--ok);background:var(--ok-soft)}
  .choice.correct .num{background:var(--ok);color:#fff}
  .choice.wrong{border-color:var(--no);background:var(--no-soft)}
  .choice.wrong .num{background:var(--no);color:#fff}
  .choice.locked{pointer-events:none}
  .choice.dim{opacity:.5}

  .btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s ease,opacity .15s ease}
  .btn:active{transform:translateY(2px)}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-gold{background:var(--gold);color:#fff}
  .btn:disabled{opacity:.4;pointer-events:none}

  .fb{border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:15px;animation:pop .2s ease}
  .fb.ok{background:var(--ok-soft);color:var(--ok)}
  .fb.no{background:var(--no-soft);color:var(--no)}
  .fb b{color:var(--ink)}
  .fb-title{font-weight:700;margin-bottom:2px}

  .done{text-align:center;padding:10px 0}
  .done .emoji{font-size:60px;display:block;margin-bottom:10px}
  .done .big{font-size:40px;font-weight:800;color:var(--teal);margin-bottom:4px;font-variant-numeric:tabular-nums}
  .done .sub{color:var(--muted);font-size:15px;margin-bottom:8px}
  .done .who{font-size:14px;color:var(--muted);margin-bottom:16px}
  .done .rank{font-size:18px;font-weight:700;margin-bottom:10px}
  .submitMsg{font-size:14px;color:var(--ok);min-height:22px;margin-bottom:16px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">

  <div class="top hidden" id="top">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-txt" id="progressTxt">1 / 22</span>
      <span class="score-pill" id="scorePill">0점</span>
    </div>
  </div>

  <div class="body">

    <!-- 참가 화면 -->
    <div id="intro" class="intro">
      <h1>🩺 의학용어 게임</h1>
      <p class="lead">이름·학번·분반을 입력하고 시작하세요.</p>
      <input id="name" placeholder="이름" maxlength="20" />
      <input id="sid" placeholder="학번" maxlength="20" />
      <select id="classNo">
        <option value="">분반 선택</option>
        <option value="101">101</option>
        <option value="102">102</option>
        <option value="103">103</option>
      </select>
      <div class="rules">
        <div class="r"><div class="ic build">🧩</div><div><b>조립 문제</b> — 한글 뜻을 보고 어근·연결모음·접미사 타일을 순서대로 눌러 영어 용어를 만드세요.</div></div>
        <div class="r"><div class="ic choice">✅</div><div><b>객관식 문제</b> — 네 개의 보기 중 정답을 하나 고르세요.</div></div>
      </div>
      <div class="err" id="err"></div>
      <button class="btn btn-primary" id="startBtn">시작하기</button>
    </div>

    <div id="quiz" class="hidden"></div>
    <div id="result" class="hidden"></div>

  </div>
</div>

<script>
const BUILD = [
  { meaning:"백혈구",   answer:["leuk","o","cyte"],    distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"적혈구",   answer:["erythr","o","cyte"],  distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"신장염",   answer:["nephr","itis"],       distractors:["oste","gastr","otomy","pathy"] },
  { meaning:"신경병증", answer:["neur","o","pathy"],   distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"피부질환", answer:["dermat","o","pathy"], distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"간비대",   answer:["hepat","o","megaly"], distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"심장비대", answer:["cardi","megaly"],     distractors:["oste","gastr","itis","pathy"] },
  { meaning:"관절염",   answer:["arthr","itis"],       distractors:["oste","gastr","megaly","pathy"] },
  { meaning:"위절제술", answer:["gastr","ectomy"],     distractors:["oste","arthr","itis","pathy"] },
  { meaning:"신장질환", answer:["nephr","pathy"],      distractors:["oste","gastr","itis","ectomy"] },
  { meaning:"신경통",   answer:["neur","algia"],       distractors:["oste","gastr","itis","ectomy"] },
];

const CHOICE = [
  { prompt:"의학용어에서 '푸른색(blue)'을 나타내는 색깔 어근은?",
    choices:["leuk/o","melan/o","cyan/o","erythr/o"], answer:2 },
  { prompt:"다음 중 '염증'을 뜻하는 접미사는?",
    choices:["-ectomy","-itis","-megaly","-pathy"], answer:1 },
  { prompt:"단어 cardiomegaly에서 접미사 -megaly의 정확한 의미는?",
    choices:["염증","절제술","거대함, 커짐","질병"], answer:2 },
  { prompt:"다음 중 '뼈'를 뜻하는 어근은?",
    choices:["dermat/o","oste/o","neur/o","gastr/o"], answer:1 },
  { prompt:"의학용어 부품을 이을 때 사용하는 연결모음에 대한 설명으로 옳은 것은?",
    choices:[
      "어근과 어근을 이을 때는 연결모음을 넣지 않는다.",
      "자음으로 시작하는 접미사가 오면 연결모음 'o'를 넣는다.",
      "모음으로 시작하는 접미사가 오면 연결모음 'o'를 반드시 붙인다.",
      "자음 앞·모음 앞 규칙이 항상 예외 없이 똑같이 적용된다."
    ], answer:1 },
  { prompt:"다음 중 '복부(배)'를 뜻하는 전신용어 어근은?",
    choices:["crani/o","thorac/o","abdomin/o","lumb/o"], answer:2 },
  { prompt:"복부를 배꼽 기준으로 4등분했을 때, '오른쪽위사분역'을 뜻하는 약어는?",
    choices:["LUQ","LLQ","RUQ","RLQ"], answer:2 },
  { prompt:"인체를 좌우 대칭으로 나누는 가상의 면은?",
    choices:["이마면 (Frontal plane)","가로면 (Transverse plane)","정중시상면 (Midsagittal plane)","수평면 (Horizontal plane)"], answer:2 },
  { prompt:"인체 방향 용어 중 '몸쪽에 가까운'을 뜻하는 용어는?",
    choices:["distal","proximal","medial","lateral"], answer:1 },
  { prompt:"병동 실무에서 '즉시, 응급'으로 진행함을 뜻하는 약어는?",
    choices:["NPO","PRN","stat","BID"], answer:2 },
  { prompt:"하루에 3회 투약을 뜻하는 병동 처방 약어는?",
    choices:["TID","QID","HS","IM"], answer:0 },
];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

let student=null, quizList=[], current=0, score=0, answered=false;

function buildQuizList(){
  const b=BUILD.map(q=>({type:"build",...q}));
  const c=CHOICE.map(q=>({type:"choice",...q}));
  quizList=shuffle([...b,...c]);
}

const $=id=>document.getElementById(id);
const $intro=$("intro"), $quiz=$("quiz"), $result=$("result"), $top=$("top");

$("startBtn").onclick=()=>{
  const name=$("name").value.trim(), sid=$("sid").value.trim(), classNo=$("classNo").value;
  if(!name||!sid||!classNo){ $("err").textContent="이름, 학번, 분반을 모두 입력하세요."; return; }
  student={name,sid,classNo};
  buildQuizList(); current=0; score=0;
  $intro.classList.add("hidden"); $result.classList.add("hidden");
  $quiz.classList.remove("hidden"); $top.classList.remove("hidden");
  renderQuestion();
};

function updateTop(){
  const total=quizList.length;
  $("progressFill").style.width=(current/total*100)+"%";
  $("progressTxt").textContent=(current+1)+" / "+total;
  $("scorePill").textContent=score+"점";
}

function renderQuestion(){
  answered=false; updateTop();
  const q=quizList[current];
  if(q.type==="build") renderBuild(q); else renderChoice(q);
}

function renderBuild(q){
  const distractorList=q.distractors||["oste","gastr","itis","ectomy"];
  const scrambled=shuffle([...q.answer,...distractorList]);
  const placed=[];

  $quiz.innerHTML=`
    <span class="qtag build">🧩 조립 문제</span>
    <div class="prompt">${q.meaning}</div>
    <div class="hint">올바른 타일을 순서대로 눌러 영어 용어를 조립하세요. (함정 타일 주의!)</div>
    <div class="build-slot empty" id="slot"></div>
    <div class="slot-hint">조립된 타일을 누르면 다시 뺄 수 있어요.</div>
    <div class="tiles" id="tiles"></div>
    <div id="fbArea"></div>
    <button class="btn btn-primary" id="checkBtn" disabled>정답 확인</button>
  `;
  const $slot=$("slot"), $tiles=$("tiles"), $check=$("checkBtn");

  scrambled.forEach((part,idx)=>{
    const t=document.createElement("button");
    t.className="tile"; t.textContent=part;
    t.onclick=()=>{ if(answered) return; t.classList.add("used"); placed.push(idx); redrawSlot(); };
    $tiles.appendChild(t);
  });

  function redrawSlot(){
    $slot.innerHTML="";
    $slot.classList.toggle("empty", placed.length===0);
    placed.forEach((sIdx,pos)=>{
      const st=document.createElement("span");
      st.className="slot-tile"; st.textContent=scrambled[sIdx];
      st.onclick=()=>{ if(answered) return; placed.splice(pos,1); $tiles.children[sIdx].classList.remove("used"); redrawSlot(); };
      $slot.appendChild(st);
    });
    $check.disabled = placed.length===0;
  }

  $check.onclick=()=>{
    if(answered) return; answered=true;
    const made=placed.map(i=>scrambled[i]);
    const correct=(made.length===q.answer.length)&&made.every((v,i)=>v===q.answer[i]);
    if(correct) score++;
    [...$tiles.children].forEach(c=>c.style.pointerEvents="none");
    [...$slot.children].forEach(c=>c.style.pointerEvents="none");
    const correctWord=q.answer.join(""), madeWord=made.join("");
    $("fbArea").innerHTML = correct
      ? `<div class="fb ok"><div class="fb-title">정답입니다! 🎉</div><b>${correctWord}</b> = ${q.answer.join(" + ")}</div>`
      : `<div class="fb no"><div class="fb-title">아쉬워요</div>내 답: ${madeWord||"—"} · 정답: <b>${correctWord}</b> (${q.answer.join(" + ")})</div>`;
    swapToNext($check);
  };
}

function renderChoice(q){
  const order=shuffle(q.choices.map((text,i)=>({text,correct:i===q.answer})));
  $quiz.innerHTML=`
    <span class="qtag choice">✅ 객관식 문제</span>
    <div class="prompt">${q.prompt}</div>
    <div class="hint">정답이라고 생각하는 보기를 하나 고르세요.</div>
    <div class="choices" id="choices"></div>
    <div id="fbArea"></div>
    <button class="btn btn-gold hidden" id="nextBtn">다음 문제</button>
  `;
  const $choices=$("choices"), numLabels=["①","②","③","④","⑤"];
  order.forEach((opt,idx)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML=`<span class="num">${numLabels[idx]}</span><span>${opt.text}</span>`;
    b.onclick=()=>{
      if(answered) return; answered=true;
      if(opt.correct) score++;
      [...$choices.children].forEach((c,i)=>{
        c.classList.add("locked");
        if(order[i].correct) c.classList.add("correct");
        else if(i===idx) c.classList.add("wrong");
        else c.classList.add("dim");
      });
      const correctText=order.find(o=>o.correct).text;
      $("fbArea").innerHTML = opt.correct
        ? `<div class="fb ok"><div class="fb-title">정답입니다! 🎉</div>잘하셨어요.</div>`
        : `<div class="fb no"><div class="fb-title">아쉬워요</div>정답: <b>${correctText}</b></div>`;
      const $next=$("nextBtn");
      $next.classList.remove("hidden");
      $next.textContent = isLast() ? "결과 보기" : "다음 문제";
      $next.onclick=goNext;
      updateTop();
    };
    $choices.appendChild(b);
  });
}

function isLast(){ return current>=quizList.length-1; }
function swapToNext(btn){
  updateTop();
  btn.textContent = isLast() ? "결과 보기" : "다음 문제";
  btn.className="btn btn-gold"; btn.disabled=false; btn.onclick=goNext;
}
function goNext(){ current++; if(current>=quizList.length) showResult(); else renderQuestion(); }

function showResult(){
  $quiz.classList.add("hidden"); $top.classList.add("hidden"); $result.classList.remove("hidden");
  const total=quizList.length, pct=Math.round(score/total*100);
  let emoji,rank;
  if(pct===100){emoji="🏆";rank="완벽해요! 의학용어 마스터";}
  else if(pct>=80){emoji="🎉";rank="훌륭해요!";}
  else if(pct>=60){emoji="👍";rank="잘했어요!";}
  else if(pct>=40){emoji="💪";rank="조금만 더!";}
  else{emoji="📚";rank="복습이 필요해요";}

  $result.innerHTML=`
    <div class="done">
      <span class="emoji">${emoji}</span>
      <div class="big">${score} / ${total}</div>
      <div class="sub">정답률 ${pct}%</div>
      <div class="who">${student.name} · ${student.sid} · ${student.classNo}분반</div>
      <div class="rank">${rank}</div>
      <div class="submitMsg" id="submitMsg">제출 중…</div>
      <button class="btn btn-primary" id="againBtn">다시 도전하기</button>
    </div>
  `;
  $("againBtn").onclick=()=>{
    buildQuizList(); current=0; score=0;
    $result.classList.add("hidden"); $quiz.classList.remove("hidden"); $top.classList.remove("hidden");
    renderQuestion();
  };
  submit();
}

function submit(){
  fetch('/api/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name:student.name, sid:student.sid, classNo:student.classNo,
      score, correct:score, total:quizList.length
    })
  })
  .then(r=>r.json())
  .then(d=>{ $("submitMsg").textContent = d.ok ? "✅ 제출 완료 (선생님이 확인할 수 있어요)" : "제출 실패 - 다시 시도해주세요"; })
  .catch(()=>{ $("submitMsg").textContent="제출 저장 실패 - 네트워크를 확인해주세요"; });
}
</script>
</body>
</html>
