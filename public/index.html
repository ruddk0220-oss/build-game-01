<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>의학용어 조립 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#f4f8fc;--bg2:#eef4fb;--navy:#1b3a5b;--blue:#2e6db4;--blueSoft:#dcebf7;--sky:#5b9bd5;--yellow:#f2b705;--yellowSoft:#fcefc7;--green:#3fa66a;--greenSoft:#d8f0e0;--ink:#2b3a47;--muted:#7b8a99;--red:#e15b64;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Jua',-apple-system,'Malgun Gothic',sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:18px;}
  .card{width:100%;max-width:620px;background:#fff;border-radius:28px;padding:26px 22px;box-shadow:0 16px 40px rgba(43,90,150,.18);border:2px solid var(--blueSoft);margin-top:10px;}
  h1{font-size:24px;color:var(--navy);text-align:center;margin-bottom:4px}
  .sub{color:var(--muted);text-align:center;font-size:14px;margin-bottom:18px}
  input{width:100%;padding:14px 16px;border:2px solid var(--blueSoft);border-radius:16px;font-size:17px;background:#fbfdff;color:var(--ink);margin-bottom:12px;outline:none;font-family:inherit}
  input:focus{border-color:var(--blue)}
  input::placeholder{color:#b9c9d8}
  .btn{width:100%;padding:14px;border:none;border-radius:18px;font-size:18px;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--sky));box-shadow:0 6px 0 -1px #2860a0;transition:transform .12s,box-shadow .12s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 -1px #2860a0}
  .btn:disabled{opacity:.45;box-shadow:none}
  .err{color:var(--red);font-size:14px;text-align:center;margin-top:8px;min-height:20px}
  .hidden{display:none}

  /* 진행 점 */
  .dots{display:flex;gap:7px;justify-content:center;margin-bottom:12px}
  .dot{width:26px;height:11px;border-radius:99px;background:var(--blueSoft)}
  .dot.done{background:var(--green)}
  .dot.now{background:var(--yellow)}

  .qtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .qnum{font-size:13px;color:var(--muted)}
  .score{font-size:15px;color:var(--blue);font-weight:bold}
  .prompt{font-size:23px;color:var(--navy);margin:6px 0 2px;text-align:left;font-weight:bold}
  .meta{font-size:13px;color:var(--muted);margin-bottom:14px}

  /* 조립 영역 (드롭존) */
  .assemble{min-height:64px;border:2.5px dashed var(--sky);border-radius:16px;background:var(--bg1);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  .assemble.empty::before{content:'여기에 타일이 순서대로 놓입니다';color:var(--muted);font-size:14px;padding:6px 4px}
  .placed{background:var(--blue);color:#fff;border-radius:12px;padding:8px 14px;font-size:16px;cursor:pointer;border:none;font-family:inherit}
  .placed .k{font-size:11px;opacity:.85;display:block;margin-top:1px}

  .hintrow{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
  .hintbtn{background:#fff;border:2px solid var(--yellowSoft);color:#b8890a;border-radius:99px;padding:8px 14px;font-family:inherit;font-size:13px;cursor:pointer}
  .hinttext{font-size:13px;color:var(--muted);flex:1;margin-left:10px;text-align:right;min-height:18px}

  /* 타일 트레이 */
  .tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
  .tile{border-radius:14px;padding:12px 16px;font-size:17px;cursor:pointer;border:2px solid;font-family:inherit;text-align:center;min-width:74px;transition:transform .1s}
  .tile:active{transform:scale(.94)}
  .tile.used{opacity:.28;pointer-events:none}
  .tile .kk{font-size:11px;display:block;margin-top:2px;font-weight:normal}
  /* 타일 색: 어근(파랑) 접두사(초록) 접미사(노랑) */
  .tile.root{background:var(--blueSoft);border-color:var(--blue);color:var(--navy)}
  .tile.prefix{background:var(--greenSoft);border-color:var(--green);color:#1d6b3f}
  .tile.suffix{background:var(--yellowSoft);border-color:var(--yellow);color:#8a6a10}

  .actions{display:flex;gap:10px}
  .actions .btn{flex:2}
  .reset{flex:1;background:#fff;color:var(--muted);border:2px solid var(--blueSoft);box-shadow:none}
  .reset:active{transform:translateY(2px)}

  /* 피드백 */
  .fb{text-align:center;padding:14px 0 4px}
  .fb .badge{display:inline-block;padding:9px 20px;border-radius:99px;font-size:18px;color:#fff;margin-bottom:8px}
  .ok{background:var(--green)}
  .no{background:var(--red)}
  .answer{font-size:17px;color:var(--navy);margin:6px 0}
  .answer b{color:var(--blue)}

  /* 완료 */
  .done{text-align:center}
  .done .emoji{font-size:56px;display:block;margin-bottom:6px}
  .done .big{font-size:40px;color:var(--blue);margin:6px 0}
  .done .line{color:var(--muted);font-size:15px}
  .greenmsg{color:var(--green);font-size:14px;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="card">
  <!-- 참가 -->
  <div id="join">
    <h1>🧩 의학용어 조립 게임</h1>
    <p class="sub">한글 뜻을 보고 어근·접두사·접미사 타일을<br/>순서대로 눌러 영어 용어를 조립하세요</p>
    <input id="name" placeholder="이름" maxlength="20" />
    <input id="sid" placeholder="학번" maxlength="20" />
    <button class="btn" id="startBtn">시작하기</button>
    <div class="err" id="err"></div>
  </div>

  <!-- 게임 -->
  <div id="game" class="hidden">
    <div class="dots" id="dots"></div>
    <div class="qtop"><span class="qnum" id="qnum"></span><span class="score" id="score">0점</span></div>
    <div class="prompt" id="prompt"></div>
    <div class="meta" id="meta"></div>

    <div class="assemble empty" id="assemble"></div>
    <div class="hintrow">
      <button class="hintbtn" id="hintBtn">💡 힌트 (어근/뜻)</button>
      <span class="hinttext" id="hinttext"></span>
    </div>

    <div class="tray" id="tray"></div>

    <div class="actions">
      <button class="reset" id="resetBtn">초기화</button>
      <button class="btn" id="checkBtn">확인</button>
    </div>

    <div class="fb hidden" id="fb">
      <span class="badge" id="fbBadge"></span>
      <div class="answer" id="answerLine"></div>
      <button class="btn" id="nextBtn" style="margin-top:10px">다음 →</button>
    </div>
  </div>

  <!-- 완료 -->
  <div id="doneScreen" class="hidden">
    <div class="done">
      <span class="emoji">🎉</span>
      <div style="font-size:20px;color:var(--navy)">모두 완료!</div>
      <div class="big" id="finalScore"></div>
      <div class="line" id="finalLine"></div>
      <button class="btn" id="retryBtn" style="margin-top:18px">다시 도전</button>
      <div class="greenmsg" id="submitMsg"></div>
    </div>
  </div>
</div>

<script>
// ===== 문제 데이터 =====
// answer: 정답 순서(조각 id 배열) / pieces: 화면에 뿌릴 타일들(함정 포함)
// type: root(어근·파랑) prefix(접두사·초록) suffix(접미사·노랑)
const QUESTIONS = [
  {
    ko: "위염", full: "gastr/o + -itis",
    pieces: [
      {id:"gastr", en:"gastr/o", ko:"위", type:"root"},
      {id:"itis", en:"-itis", ko:"염증", type:"suffix"},
      {id:"megaly", en:"-megaly", ko:"커짐", type:"suffix"},
      {id:"hepat", en:"hepat/o", ko:"간", type:"root"},
    ],
    answer: ["gastr","itis"],
    hint: "어근 gastr/o(위) + 접미사 -itis(염증)"
  },
  {
    ko: "관절염", full: "arthr/o + -itis",
    pieces: [
      {id:"arthr", en:"arthr/o", ko:"관절", type:"root"},
      {id:"itis", en:"-itis", ko:"염증", type:"suffix"},
      {id:"algia", en:"-algia", ko:"통증", type:"suffix"},
      {id:"oste", en:"oste/o", ko:"뼈", type:"root"},
    ],
    answer: ["arthr","itis"],
    hint: "관절(arthr/o) + 염증(-itis)"
  },
  {
    ko: "퇴행성 관절염 (골관절염)", full: "oste/o + arthr + -itis",
    pieces: [
      {id:"oste", en:"oste/o", ko:"뼈", type:"root"},
      {id:"arthr", en:"arthr", ko:"관절", type:"root"},
      {id:"itis", en:"-itis", ko:"염증", type:"suffix"},
      {id:"scopy", en:"-scopy", ko:"들여다보는 검사", type:"suffix"},
      {id:"osis", en:"-osis", ko:"비정상 상태", type:"suffix"},
    ],
    answer: ["oste","arthr","itis"],
    hint: "뼈(oste/o) + 관절(arthr) + 염증(-itis)"
  },
  {
    ko: "심장비대", full: "cardi/o + -megaly",
    pieces: [
      {id:"cardi", en:"cardi/o", ko:"심장", type:"root"},
      {id:"megaly", en:"-megaly", ko:"커짐", type:"suffix"},
      {id:"pathy", en:"-pathy", ko:"질병", type:"suffix"},
      {id:"gastr", en:"gastr/o", ko:"위", type:"root"},
    ],
    answer: ["cardi","megaly"],
    hint: "심장(cardi/o) + 커짐(-megaly)"
  },
  {
    ko: "피부염", full: "dermat/o + -itis",
    pieces: [
      {id:"dermat", en:"dermat/o", ko:"피부", type:"root"},
      {id:"itis", en:"-itis", ko:"염증", type:"suffix"},
      {id:"logy", en:"-logy", ko:"학문", type:"suffix"},
      {id:"neur", en:"neur/o", ko:"신경", type:"root"},
    ],
    answer: ["dermat","itis"],
    hint: "피부(dermat/o) + 염증(-itis)"
  },
  {
    ko: "위 절제술", full: "gastr/o + -ectomy",
    pieces: [
      {id:"gastr", en:"gastr/o", ko:"위", type:"root"},
      {id:"ectomy", en:"-ectomy", ko:"절제술", type:"suffix"},
      {id:"tomy", en:"-tomy", ko:"절개술", type:"suffix"},
      {id:"hepat", en:"hepat/o", ko:"간", type:"root"},
    ],
    answer: ["gastr","ectomy"],
    hint: "위(gastr/o) + 절제술(-ectomy)"
  },
  {
    ko: "간비대", full: "hepat/o + -megaly",
    pieces: [
      {id:"hepat", en:"hepat/o", ko:"간", type:"root"},
      {id:"megaly", en:"-megaly", ko:"커짐", type:"suffix"},
      {id:"itis", en:"-itis", ko:"염증", type:"suffix"},
      {id:"oste", en:"oste/o", ko:"뼈", type:"root"},
    ],
    answer: ["hepat","megaly"],
    hint: "간(hepat/o) + 커짐(-megaly)"
  },
  {
    ko: "심장막염 (심장 주위 염증)", full: "peri- + cardi + -itis",
    pieces: [
      {id:"peri", en:"peri-", ko:"주위", type:"prefix"},
      {id:"cardi", en:"cardi", ko:"심장", type:"root"},
      {id:"itis", en:"-itis", ko:"염증", type:"suffix"},
      {id:"endo", en:"endo-", ko:"안에", type:"prefix"},
      {id:"megaly", en:"-megaly", ko:"커짐", type:"suffix"},
    ],
    answer: ["peri","cardi","itis"],
    hint: "주위(peri-) + 심장(cardi) + 염증(-itis)"
  },
  {
    ko: "뼈 연화증", full: "oste/o + -malacia",
    pieces: [
      {id:"oste", en:"oste/o", ko:"뼈", type:"root"},
      {id:"malacia", en:"-malacia", ko:"연화", type:"suffix"},
      {id:"itis", en:"-itis", ko:"염증", type:"suffix"},
      {id:"cardi", en:"cardi/o", ko:"심장", type:"root"},
    ],
    answer: ["oste","malacia"],
    hint: "뼈(oste/o) + 연화(-malacia)"
  },
  {
    ko: "배뇨곤란", full: "dys- + -uria",
    pieces: [
      {id:"dys", en:"dys-", ko:"곤란", type:"prefix"},
      {id:"uria", en:"-uria", ko:"소변", type:"suffix"},
      {id:"hyper", en:"hyper-", ko:"과다", type:"prefix"},
      {id:"pathy", en:"-pathy", ko:"질병", type:"suffix"},
    ],
    answer: ["dys","uria"],
    hint: "곤란(dys-) + 소변(-uria)"
  },
];

const $=(id)=>document.getElementById(id);
let student={}, pos=0, score=0, correctCount=0, placed=[], answered=false, hintUsed=false, startAt=0;
const TOTAL=QUESTIONS.length;

$('startBtn').onclick=()=>{
  const name=$('name').value.trim(), sid=$('sid').value.trim();
  if(!name||!sid){$('err').textContent='이름과 학번을 모두 입력하세요';return;}
  student={name,sid};
  $('join').classList.add('hidden'); $('game').classList.remove('hidden');
  buildDots(); render();
};

function buildDots(){
  $('dots').innerHTML = QUESTIONS.map((_,i)=>`<span class="dot" id="dot${i}"></span>`).join('');
}
function updateDots(){
  QUESTIONS.forEach((_,i)=>{
    const d=$('dot'+i); d.className='dot'+(i<pos?' done':i===pos?' now':'');
  });
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function render(){
  answered=false; placed=[]; hintUsed=false; startAt=Date.now();
  const q=QUESTIONS[pos];
  $('qnum').textContent=`${pos+1} / ${TOTAL}`;
  $('score').textContent=score+'점';
  $('prompt').textContent=q.ko;
  $('meta').textContent=`형태소 ${q.answer.length}개 · 타일 중 오답도 섞여 있어요`;
  $('hinttext').textContent='';
  $('fb').classList.add('hidden');
  $('checkBtn').classList.remove('hidden');
  $('resetBtn').classList.remove('hidden');
  updateDots();
  renderAssemble();
  // 타일 트레이 (섞기)
  const tray=$('tray'); tray.innerHTML='';
  shuffle(q.pieces).forEach(pc=>{
    const b=document.createElement('button');
    b.className='tile '+pc.type; b.dataset.id=pc.id;
    b.innerHTML=`${pc.en}<span class="kk">${pc.ko}</span>`;
    b.onclick=()=>placeTile(pc.id);
    tray.appendChild(b);
  });
}

function renderAssemble(){
  const q=QUESTIONS[pos];
  const box=$('assemble');
  if(placed.length===0){ box.className='assemble empty'; box.innerHTML=''; return; }
  box.className='assemble';
  box.innerHTML='';
  placed.forEach(id=>{
    const pc=q.pieces.find(x=>x.id===id);
    const b=document.createElement('button');
    b.className='placed';
    b.innerHTML=`${pc.en}<span class="k">${pc.ko}</span>`;
    b.onclick=()=>removeTile(id);
    box.appendChild(b);
  });
}

function placeTile(id){
  if(answered) return;
  if(placed.includes(id)) return;
  placed.push(id);
  markUsed(); renderAssemble();
}
function removeTile(id){
  if(answered) return;
  placed=placed.filter(x=>x!==id);
  markUsed(); renderAssemble();
}
function markUsed(){
  document.querySelectorAll('.tile').forEach(t=>{
    t.classList.toggle('used', placed.includes(t.dataset.id));
  });
}

$('resetBtn').onclick=()=>{ if(answered)return; placed=[]; markUsed(); renderAssemble(); };

$('hintBtn').onclick=()=>{
  const q=QUESTIONS[pos];
  $('hinttext').textContent=q.hint;
  hintUsed=true;
};

$('checkBtn').onclick=()=>{
  if(answered) return;
  const q=QUESTIONS[pos];
  answered=true;
  const isCorrect = placed.length===q.answer.length && placed.every((id,i)=>id===q.answer[i]);
  // 점수: 정답 100 + 속도보너스(최대100) - 힌트 사용 시 보너스 절반
  let gain=0;
  if(isCorrect){
    const elapsed=Date.now()-startAt;
    const limit=30000;
    let bonus=Math.round(Math.max(0,limit-elapsed)/limit*100);
    if(hintUsed) bonus=Math.round(bonus/2);
    gain=100+bonus;
    score+=gain; correctCount++;
  }
  $('score').textContent=score+'점';
  $('checkBtn').classList.add('hidden'); $('resetBtn').classList.add('hidden');
  const badge=$('fbBadge');
  badge.textContent=isCorrect?`정답! +${gain}점`:'오답';
  badge.className='badge '+(isCorrect?'ok':'no');
  $('answerLine').innerHTML = `정답: <b>${q.full}</b>`;
  $('fb').classList.remove('hidden');
};

$('nextBtn').onclick=()=>{
  if(pos<TOTAL-1){ pos++; render(); } else showDone();
};

function showDone(){
  updateDots();
  $('game').classList.add('hidden'); $('doneScreen').classList.remove('hidden');
  $('finalScore').textContent=score+'점';
  $('finalLine').textContent=`${TOTAL}문제 중 ${correctCount}개 정답`;
  submit();
}
function submit(){
  fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:student.name,sid:student.sid,score,correct:correctCount,total:TOTAL})})
    .then(r=>r.json()).then(d=>{ if(d.ok) $('submitMsg').textContent='✅ 제출 완료 (선생님이 확인할 수 있어요)'; })
    .catch(()=>{ $('submitMsg').textContent='제출 저장 실패 - 다시 시도해주세요'; });
}
$('retryBtn').onclick=()=>{ pos=0;score=0;correctCount=0; $('doneScreen').classList.add('hidden'); $('game').classList.remove('hidden'); buildDots(); render(); };
</script>
</body>
</html>
