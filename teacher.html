<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>의학용어 게임 결과 (교수자용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#5a5568; --mint:#7ed9c3; --mint-soft:#dff7f0; --mint-deep:#3fbfa3;
    --pink:#ffb3c9; --pink-soft:#ffe3ec; --pink-deep:#ff7fa3;
    --yellow-soft:#fff6d9; --cream:#fffaf3; --line:#f0e6dd; --muted:#a89f97;
    --no:#ff8f9c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Gaegu','Malgun Gothic',sans-serif;background:linear-gradient(135deg,#fff6d9 0%,#ffe3ec 50%,#dff7f0 100%);background-attachment:fixed;color:var(--ink);min-height:100vh;padding:24px;line-height:1.55;font-size:17px}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-family:'Jua',sans-serif;font-size:30px;margin-bottom:4px;color:var(--pink-deep)}
  .sub{color:var(--muted);font-size:16px;margin-bottom:20px;font-weight:700}
  h1,.btn,.stat .v{font-family:'Jua',sans-serif}

  .login{background:var(--cream);border:3px solid #fff;border-radius:26px;padding:26px;max-width:400px;box-shadow:0 12px 34px rgba(255,127,163,.15)}
  input,select{padding:13px 16px;border:3px solid var(--pink-soft);border-radius:16px;font-size:16px;background:#fff;color:var(--ink);outline:none;font-family:'Gaegu',sans-serif;font-weight:700}
  input:focus,select:focus{border-color:var(--pink)}
  .login input{width:100%;margin-bottom:12px}
  .btn{border:none;border-radius:16px;padding:13px 20px;font-size:17px;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;box-shadow:0 4px 0 rgba(255,127,163,.3)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,127,163,.3)}
  .btn.ghost{background:#fff;color:var(--muted);border:3px solid var(--pink-soft);box-shadow:0 4px 0 rgba(240,230,221,.6)}
  .btn.danger{background:linear-gradient(135deg,#ffa3ad,var(--no));box-shadow:0 4px 0 rgba(255,143,156,.35)}
  .err{color:var(--no);font-size:15px;font-weight:700;min-height:20px;margin-top:8px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .spacer{flex:1}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--cream);border:3px solid #fff;border-radius:20px;padding:14px 20px;min-width:130px;box-shadow:0 6px 18px rgba(126,217,195,.14)}
  .stat .k{font-size:14px;color:var(--muted);font-weight:700}
  .stat .v{font-size:28px;color:var(--mint-deep)}

  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--cream);border:3px solid #fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 22px rgba(255,127,163,.1)}
  th,td{padding:13px 16px;text-align:left;font-size:16px;border-bottom:2px solid var(--pink-soft);font-weight:700}
  th{background:var(--mint-soft);color:var(--mint-deep)}
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums}
  .rank1{color:var(--pink-deep);font-size:19px}
  .empty{text-align:center;color:var(--muted);padding:34px;font-weight:700}
  .msg{color:var(--mint-deep);font-size:15px;font-weight:700;min-height:20px;margin-top:10px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 의학용어 게임 결과 🌷</h1>
  <p class="sub">학생들의 제출 기록을 확인해요! (학생별 최고점 기준)</p>

  <div class="login" id="login">
    <input id="code" type="password" placeholder="교수자 비밀번호" />
    <button class="btn" id="loginBtn">확인 🔑</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="dash" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <select id="classFilter">
        <option value="">전체 분반</option>
        <option value="101">101분반</option>
        <option value="102">102분반</option>
        <option value="103">103분반</option>
      </select>
      <div class="spacer"></div>
      <button class="btn ghost" id="refreshBtn">새로고침 🔄</button>
      <button class="btn ghost" id="csvBtn">CSV 다운로드 📥</button>
      <button class="btn danger" id="resetBtn">기록 삭제 🗑️</button>
    </div>
    <div id="tableWrap"></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let CODE="", DATA=[];

$("loginBtn").onclick=login;
$("code").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });

function login(){
  const code=$("code").value.trim();
  if(!code){ $("loginErr").textContent="비밀번호를 입력하세요."; return; }
  fetch('/api/results?code='+encodeURIComponent(code))
    .then(r=>{ if(!r.ok) throw new Error("forbidden"); return r.json(); })
    .then(d=>{
      CODE=code; DATA=d.list||[];
      $("login").classList.add("hidden");
      $("dash").classList.remove("hidden");
      render();
    })
    .catch(()=>{ $("loginErr").textContent="비밀번호가 올바르지 않습니다."; });
}

$("refreshBtn").onclick=()=>{
  fetch('/api/results?code='+encodeURIComponent(CODE))
    .then(r=>r.json()).then(d=>{ DATA=d.list||[]; render(); $("msg").textContent="새로고침 완료 ✨"; });
};
$("classFilter").onchange=render;

$("resetBtn").onclick=()=>{
  if(!confirm("모든 기록을 삭제할까요? 되돌릴 수 없습니다.")) return;
  fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:CODE})})
    .then(r=>r.json()).then(d=>{ if(d.ok){ DATA=[]; render(); $("msg").textContent="기록을 삭제했습니다."; } });
};

$("csvBtn").onclick=()=>{
  const rows=filtered();
  const head=["분반","이름","학번","점수","정답","총문항","시도횟수","최종제출"];
  const lines=[head.join(",")];
  rows.forEach(r=>{
    lines.push([r.classNo,r.name,r.sid,r.score,r.correct,r.total,r.attempts||1,fmt(r.updatedAt)]
      .map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(","));
  });
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="의학용어게임_결과.csv";
  a.click();
};

function filtered(){
  const cf=$("classFilter").value;
  return DATA.filter(r=>!cf||String(r.classNo)===cf);
}

function render(){
  const rows=filtered();
  const n=rows.length;
  const avg=n? Math.round(rows.reduce((s,r)=>s+(r.score||0),0)/n*10)/10 : 0;
  const top=n? Math.max(...rows.map(r=>r.score||0)) : 0;
  $("stats").innerHTML=`
    <div class="stat"><div class="k">제출 인원</div><div class="v">${n}명</div></div>
    <div class="stat"><div class="k">평균 점수</div><div class="v">${avg}</div></div>
    <div class="stat"><div class="k">최고 점수</div><div class="v">${top}</div></div>
  `;
  if(n===0){ $("tableWrap").innerHTML=`<div class="empty">아직 제출된 기록이 없어요 🌱</div>`; return; }
  let html=`<table><thead><tr>
    <th>순위</th><th>분반</th><th>이름</th><th>학번</th><th>점수</th><th>정답/총</th><th>시도</th><th>최종 제출</th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    html+=`<tr>
      <td class="${i===0?'rank1':''}">${i===0?'👑 ':''}${i+1}</td>
      <td>${esc(r.classNo)}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.sid)}</td>
      <td class="num">${r.score}</td>
      <td class="num">${r.correct}/${r.total}</td>
      <td class="num">${r.attempts||1}</td>
      <td>${fmt(r.updatedAt)}</td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  $("tableWrap").innerHTML=html;
}

function fmt(iso){
  if(!iso) return "-";
  const d=new Date(iso);
  const p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
